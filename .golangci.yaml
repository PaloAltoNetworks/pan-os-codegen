version: "2"
linters:
  enable:
    - asasalint
    - copyloopvar
    - decorder
    - dogsled
    - errname
    - exhaustive
    - fatcontext
    - forcetypeassert
    - ginkgolinter
    - grouper
    - importas
    - makezero
    - nakedret
    - nilerr
    - nilnil
    - predeclared
    - sloglint
  settings:
    staticcheck:
      # Keep parity with golangci-lint v1, where stylecheck (ST*) and
      # quickfix (QF*) checks were not enabled.
      checks:
        - all
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - generated/
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/paloaltonetworks/pan-os-codegen)
  exclusions:
    generated: lax
    paths:
      - generated/
      - third_party$
      - builtin$
      - examples$
